root.addEventListener('keydown',e=>{if(e.key==='Escape'&&!overlay.hidden){overlay.hidden=true;root.querySelector('[data-action="manager"]').focus();}if(!overlay.hidden&&e.key==='Tab'){const all=[...overlay.querySelectorAll('button,input,select')].filter(el=>!el.disabled&&!el.hidden&&el.getClientRects().length);const first=all[0],last=all[all.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
function restore(saved){if(!saved||typeof saved!=='object')return;for(const k of ['tab','scope','view']){const values={tab:['conversation','connections','activity'],scope:['recent','live','all'],view:['graph','list']};if(values[k].includes(saved[k]))state[k]=saved[k];}for(const k of ['showLinks','sidebar','inspector'])if(typeof saved[k]==='boolean')state[k]=saved[k];if(projects.some(p=>p.id===saved.project)||saved.project===null)state.project=saved.project;if(['session','project'].includes(saved.selectedType)&&[...projects,...sessions].some(i=>i.id===saved.selected)){state.selectedType=saved.selectedType;state.selected=saved.selected;}for(const k of ['links','projectLinks'])if(Array.isArray(saved[k])&&saved[k].length<30){const ids=new Set();state[k]=saved[k].filter(l=>l&&typeof l.id==='string'&&!ids.has(l.id)&&ids.add(l.id)&&typeof l.source==='string'&&typeof l.target==='string'&&l.source!==l.target&&kinds[l.kind]).map(l=>({...l,note:typeof l.note==='string'?l.note.slice(0,200):''}));}if(saved.positions&&typeof saved.positions==='object')for(const [id,p] of Object.entries(saved.positions))if(sessions.some(s=>s.id===id)&&Number.isFinite(p.x)&&Number.isFinite(p.y))state.positions[id]={x:p.x,y:p.y};}
restore(window.openai?.widgetState?.privateContent);syncChrome();layout();renderInspector();
new ResizeObserver(()=>{if(resizeQueued||state.view!=='graph')return;resizeQueued=true;requestAnimationFrame(()=>{resizeQueued=false;if(!dragging)layout();});}).observe(map);
window.addEventListener('openai:set_globals',e=>{const saved=e.detail?.globals?.widgetState?.privateContent;if(saved){restore(saved);syncChrome();layout();renderInspector();}});
if(globalThis.Tweak){const tweak=new Tweak({container:map,onChange:()=>{root.style.setProperty('--mt-node-radius',design.radius+'px');layout();}});tweak.addSlider(design,'radius',{label:'노드 모서리',min:4,max:16,unit:'px'});tweak.addSlider(design,'gap',{label:'세션 사이 간격',min:32,max:64,unit:'px'});}
})();
</script>
